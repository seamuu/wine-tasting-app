databases:
  - name: wine-flight-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: wine-flight
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wine-flight-db
          property: connectionString
